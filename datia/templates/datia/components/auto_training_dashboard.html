{% load i18n %}
<div id="autoTrainingDashboard" style="padding-top: 2rem;">
    <!-- Header & Controls -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h3 style="color: #fff; margin:0; font-size: 1.5rem;">Dashboard Auto-Entreno</h3>
            <div id="dashboard-last-updated" style="color: #71717a; font-size: 0.8rem; margin-top: 4px;">
                Actualizado: -
            </div>
        </div>
        <div>
            <button id="btn-refresh-dashboard" onclick="loadDashboardStats()" class="btn-glow"
                style="padding: 0.6rem 1.2rem; font-size: 0.9rem;">
                🔄 Actualizar
            </button>
        </div>
    </div>

    <!-- KPI Row -->
    <div
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
        <!-- Total Tables -->
        <div class="glass-card"
            style="padding: 1.5rem; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 16px;">
            <div style="color: #93c5fd; font-size: 0.85rem; margin-bottom: 0.5rem;">Tablas Totales</div>
            <div style="font-size: 2rem; font-weight: 700; color: #fff;">
                <span id="kpi-total-tables">-</span>
            </div>
        </div>

        <!-- Synced Tables -->
        <div class="glass-card"
            style="padding: 1.5rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 16px;">
            <div style="color: #86efac; font-size: 0.85rem; margin-bottom: 0.5rem;">Sincronizadas</div>
            <div style="font-size: 2rem; font-weight: 700; color: #fff;">
                <span id="kpi-synced-tables">-</span>
            </div>
        </div>

        <!-- Total Training -->
        <div class="glass-card"
            style="padding: 1.5rem; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px;">
            <div style="color: #d8b4fe; font-size: 0.85rem; margin-bottom: 0.5rem;">Ejemplos SQL</div>
            <div style="font-size: 2rem; font-weight: 700; color: #fff;">
                <span id="kpi-total-training">-</span>
            </div>
        </div>

        <!-- Relationships -->
        <div class="glass-card"
            style="padding: 1.5rem; background: rgba(236, 72, 153, 0.1); border: 1px solid rgba(236, 72, 153, 0.2); border-radius: 16px;">
            <div style="color: #f9a8d4; font-size: 0.85rem; margin-bottom: 0.5rem;">Relaciones</div>
            <div style="font-size: 2rem; font-weight: 700; color: #fff;">
                <span id="kpi-relations">-</span>
            </div>
        </div>
    </div>

    <!-- Charts & Lists Grid -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start;">

        <!-- Left Column: Activity & Network -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">

            <!-- Recent Activity (Moved here to replace Chart) -->
            <div class="glass-card"
                style="padding: 1.5rem; background: rgba(24, 24, 27, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h4
                        style="color: #e4e4e7; font-size: 0.95rem; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
                        📜 Actividad Reciente
                    </h4>
                    <span style="font-size: 0.75rem; color: #71717a;">Últimos 20</span>
                </div>
                <div id="dashboard-recent-activity" style="max-height: 300px; overflow-y: auto;">
                    <div style="padding:1rem; color:#52525b; text-align:center;">Cargando...</div>
                </div>
            </div>

            <!-- Network / Most Connected -->
            <div class="glass-card"
                style="padding: 1.5rem; background: rgba(24, 24, 27, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;">
                <h4
                    style="color: #e4e4e7; font-size: 0.95rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                    🔗 Tablas más interconectadas
                </h4>
                <div id="dashboard-network-chart" style="min-height: 250px;">
                    <!-- Chart Rendered by JS -->
                    <div style="display:flex; justify-content:center; align-items:center; height:250px; color:#52525b;">
                        Cargando...</div>
                </div>
            </div>

        </div>

        <!-- Right Column: Tables List -->
        <div class="glass-card"
            style="padding: 1.5rem; background: rgba(24, 24, 27, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h4 style="color: #e4e4e7; font-size: 0.95rem; margin: 0;">Tablas del Sistema</h4>
                <span style="font-size: 0.75rem; color: #71717a;">Ordenado por actividad</span>
            </div>

            <div id="dashboard-tables-list" style="max-height: 600px; overflow-y: auto; padding-right: 5px;">
                <!-- List Items Rendered by JS -->
                <div style="text-align: center; padding: 2rem; color: #52525b;">Cargando tablas...</div>
            </div>
        </div>

    </div>
</div>
