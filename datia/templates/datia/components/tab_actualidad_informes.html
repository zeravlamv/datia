{% load static i18n %}
<div id="tab-actualidad-informes" class="financial-theme">
    <div class="dashboard-v2-container">
        <div id="fin-informes-grid" class="fin-grid-container">

            <!-- SECTION: QUARTERLY REPORT -->
            <div id="fin-section-quarterly" class="fin-grid-item" draggable="true" data-id="quarterly">
                <div class="fin-card-simple">
                    <div class="fin-card-header">
                        <span class="fin-card-title">{% trans "Informe Trimestral" %}</span>
                        <div class="fin-card-tools" style="display: flex; gap: 10px; align-items: center;">
                            <select id="fin-quarter-dept" onchange="initQuarterly()" style="background:#27272a; color:white; border:1px solid #3f3f46; border-radius:4px; padding:4px 8px; font-size:0.85rem;">
                                <option value="">{% trans "Todos los Departamentos" %}</option>
                            </select>
                            <button class="btn-fin-action" onclick="exportQuarterly('csv')" title="{% trans 'Exportar a CSV' %}"><i class="fas fa-file-csv"></i></button>
                            <button class="btn-fin-action" onclick="exportQuarterly('excel')" title="{% trans 'Exportar a Excel' %}"><i class="fas fa-file-excel"></i></button>
                        </div>
                        <i class="fas fa-grip-lines fin-drag-handle"></i>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:20px; padding: 15px;">
                        <div id="fin-quarter-cards" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:15px;"></div>
                        <div id="fin-quarter-chart" class="fin-chart-container" style="height:350px;"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
